services:
  mongodb:
    image: mongo:7.0
    container_name: coal-regulation-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: coal_admin
      MONGO_INITDB_ROOT_PASSWORD: coal_password
      MONGO_INITDB_DATABASE: coal_regulation_ai
    ports:
      - "27017:27017"
    volumes:
      - ./backend/data/mongodb:/data/db
      - ./backend/data/mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: coal-regulation-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./backend/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
